name: Build Native APK

on:
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decodificar el Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android.keystore

      - name: Inicializar y Compilar APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bubblewrap init --manifest https://alexrey11.github.io/reporte-mensual/manifest.json --directory ./android-project --skipPwaValidation
          cp android.keystore ./android-project/android.keystore
          cd ./android-project
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('twa-manifest.json'));m.keystorePath='./android.keystore';m.keyAlias='${{ secrets.KEY_ALIAS }}';fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2))"
          bubblewrap build

      - name: Subir APK Nativa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mensual-native-apk
          path: ./android-project/app-release-signed.apk