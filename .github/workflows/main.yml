name: Build Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configurar rutas de Android
        run: |
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$SDK_PATH\"}" > ~/.bubblewrap/config.json

      - name: Verificar que el manifiesto existe
        run: |
          echo "Descargando manifiesto para verificar..."
          # Usamos .webmanifest que es el nombre real
          curl -s -o manifest_check.json https://alexrey11.github.io/reporte-mensual/manifest.webmanifest
          echo "Contenido del manifiesto:"
          cat manifest_check.json
          # Si el archivo contiene un error HTML, detenemos el proceso aquí
          if grep -q "<!DOCTYPE" manifest_check.json; then
            echo "Error: GitHub Pages devolvió HTML en lugar de JSON. La URL es incorrecta."
            exit 1
          fi

      - name: Decodificar el Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android.keystore

      - name: Generar y Compilar Proyecto Android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 🔥 AQUÍ ESTÁ EL CAMBIO: Usamos .webmanifest
          yes "" | bubblewrap init --manifest https://alexrey11.github.io/reporte-mensual/manifest.webmanifest --directory ./android-project --skipPwaValidation
          
          cp android.keystore ./android-project/android.keystore
          cd ./android-project
          
          yes "" | bubblewrap build

      - name: Subir APK Nativa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mensual-native-apk
          path: ./android-project/app-release-signed.apk