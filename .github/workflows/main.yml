name: Build Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configurar rutas de Android
        run: |
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$SDK_PATH\"}" > ~/.bubblewrap/config.json

      - name: Decodificar el Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android.keystore

      # 🔥 CREAMOS EL MANIFIESTO LOCAL CON TODAS LAS RESPUESTAS
      - name: Crear twa-manifest.json
        run: |
          cat > twa-manifest.json << EOF
          {
            "packageId": "cu.alexrey11.reportemensual",
            "host": "alexrey11.github.io",
            "name": "ReporteMensual",
            "launcherName": "Reportes",
            "display": "standalone",
            "themeColor": "#0f172a",
            "navigationColor": "#0f172a",
            "backgroundColor": "#ffffff",
            "startUrl": "/reporte-mensual/",
            "iconUrl": "https://alexrey11.github.io/reporte-mensual/pwa-512x512.png",
            "maskableIconUrl": "https://alexrey11.github.io/reporte-mensual/pwa-512x512.png",
            "webManifestUrl": "https://alexrey11.github.io/reporte-mensual/manifest.webmanifest",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            },
            "enableNotifications": false,
            "generatorApp": "bubblewrap-cli",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://alexrey11.github.io/reporte-mensual/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": [],
            "appVersion": "1.0.0"
          }
          EOF

      - name: Generar Proyecto Android
        run: |
          # 🔥 Usamos el manifiesto LOCAL, no el remoto
          bubblewrap init --manifest=./twa-manifest.json --directory ./android-project

      - name: Compilar APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp android.keystore ./android-project/android.keystore
          cd ./android-project
          bubblewrap build

      - name: Subir APK Nativa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mensual-native-apk
          path: ./android-project/app-release-signed.apk