name: Build Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # 🔥 SOLUCIÓN DEFINITIVA: Crear el config.json manualmente
      - name: Configurar rutas de Android para Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "{\"jdkPath\": \"$JAVA_HOME\", \"androidSdkPath\": \"$SDK_PATH\"}" > ~/.bubblewrap/config.json
          echo "Configuración creada:"
          cat ~/.bubblewrap/config.json

      - name: Decodificar el Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android.keystore

      # 🔥 Usamos 'yes' para responder automáticamente a cualquier pregunta
      - name: Inicializar Proyecto Android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | bubblewrap init --manifest https://alexrey11.github.io/reporte-mensual/manifest.json --directory ./android-project --skipPwaValidation

      - name: Ajustar la firma del manifiesto
        run: |
          cd ./android-project
          cp ../android.keystore ./android.keystore
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('twa-manifest.json'));m.keystorePath='./android.keystore';m.keyAlias='${{ secrets.KEY_ALIAS }}';fs.writeFileSync('twa-manifest.json',JSON.stringify(m,null,2))"

      - name: Compilar APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd ./android-project
          yes | bubblewrap build

      - name: Subir APK Nativa
        uses: actions/upload-artifact@v4
        with:
          name: reporte-mensual-native-apk
          path: ./android-project/app-release-signed.apk
